name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # The lock and the Ctrl+C path differ by platform.
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # The desktop extra brings the window's theme, so its tests run where there is a screen (macOS, Windows).
      - run: pip install -e ".[dev,desktop]"
      - run: ruff check .
      - run: ruff format --check .
      # YouTube blocks most CI addresses, so the network tests stay local (pytest -m network).
      - run: pytest -q --cov=vidkeep --cov-report=term-missing

  firefox-addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -e ".[dev]"
      # The add-on, the native host and vidkeep together in a real headless Firefox.
      - run: pytest -m firefox -v
      - run: npx --yes web-ext@10.7.0 lint --source-dir browser/firefox --self-hosted=false
      - run: npx --yes web-ext@10.7.0 build --source-dir browser/firefox --artifacts-dir dist --filename vidkeep-firefox.zip
      - uses: actions/upload-artifact@v7
        with:
          name: firefox-addon
          path: dist/*.zip

  mac-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The downloadable app: vidkeep, ffmpeg and deno inside, nothing else to install.
      - run: macos/build.sh --standalone
        env:
          PYTHON: python
      - run: lipo -archs macos/build/Vidkeep.app/Contents/MacOS/Vidkeep
      # With a bare PATH, as on a Mac that has nothing installed: the app's own tools must be found.
      - run: |
          env -i HOME="$HOME" PATH=/usr/bin:/bin macos/build/Vidkeep.app/Contents/Resources/vidkeep/vidkeep doctor -o "$RUNNER_TEMP" | tee doctor.txt
          ! grep -q missing doctor.txt
      - run: mkdir -p dist && ditto -c -k --keepParent macos/build/Vidkeep.app dist/Vidkeep-mac.zip
      - uses: actions/upload-artifact@v7
        with:
          name: mac-app
          path: dist/Vidkeep-mac.zip

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: packaging\windows\build.ps1
        shell: pwsh
      # Installs the setup file, downloads through the installed copy, and photographs the window.
      - run: packaging\windows\smoke.ps1 -Link https://archive.org/details/BigBuckBunny_124
        shell: pwsh
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: dist/vidkeep-setup.exe
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-screenshot
          path: dist/windows-window.png

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, firefox-addon, mac-app, windows-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: "{firefox-addon,mac-app,windows-installer}"
          merge-multiple: true
          path: release
      # Unversioned file names, so the README's releases/latest/download links always work.
      - run: >
          gh release create "$GITHUB_REF_NAME" release/vidkeep-setup.exe release/Vidkeep-mac.zip release/vidkeep-firefox.zip
          --repo "$GITHUB_REPOSITORY" --title "vidkeep $GITHUB_REF_NAME" --notes-file packaging/release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
